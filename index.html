<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="大模型推理部署计算器：显存可行性、多机并行方案搜索、roofline 性能估算与 vllm serve 命令，每个数字可追溯。">
<title>Infra_cal 推理部署计算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,800;6..96,900&family=Manrope:wght@500;700;800&family=LXGW+WenKai+TC&family=Noto+Serif+SC:wght@500;900&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* ============================================================
   Emerald Editorial — 印刷油墨三色系统
   翡翠 #3CD896（画布）· 藏青 #0F1A5C（墨/反白面板）· 燕麦纸 #F1E9D6
   Bodoni Moda 900 大字 + Manrope 大写 chrome；4px 墨线；零圆角零阴影
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #3cd896; --bg-2: #2dc684; --bg-3: #25b377;
  --ink: #0f1a5c; --ink-3: #3a4593;
  --paper: #f1e9d6;
  --rule: rgba(15, 26, 92, .22);
  --grid: rgba(60, 216, 150, .22);
  --serif: "Bodoni Moda", "LXGW WenKai TC", "Noto Serif SC", Georgia, serif;
  --sans: "Manrope", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.6 var(--sans); padding-inline: 16px; padding-block: 0 64px; }
.wrap { max-width: 1080px; margin: 0 auto; }
button, input { font: inherit; color: inherit; border-radius: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
a { color: var(--ink); }
.serif { font-family: var(--serif); }
.chrome { font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  body.boot [data-reveal] { opacity: 0; transform: translateY(14px); animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .vbar i { transition: width .35s cubic-bezier(.2,.7,.2,1); }
}

/* ---------- 刊头 ---------- */
.masthead { display: flex; justify-content: space-between; gap: 12px; padding: 22px 0 14px; font: 700 12px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
.rule4 { height: 4px; background: var(--ink); }
.rule2 { height: 2px; background: var(--ink); }

/* ---------- 封面：配置宣言 ---------- */
.cover { text-align: center; padding: 34px 0 26px; }
.eyebrow { font: 800 12px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; margin-bottom: 20px; }
.model-line { display: inline-block; border: 0; background: none; cursor: pointer; padding: 0 8px;
  font-family: var(--serif); font-weight: 900; font-size: clamp(46px, 8.2vw, 104px); line-height: .95; letter-spacing: -.02em; }
.model-line:hover { color: var(--ink-3); }
.orn { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 22px; max-width: 560px; margin: 18px auto; }
.orn .rules { display: grid; gap: 3px; }
.orn .rules i { display: block; height: 4px; background: var(--ink); }
.orn .word { font-family: var(--serif); font-weight: 800; font-size: 30px; line-height: 1; }
.gpu-line { border: 0; background: none; cursor: pointer; padding: 0 8px;
  font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 4.6vw, 56px); line-height: 1; letter-spacing: -.015em; }
.gpu-line:hover { color: var(--ink-3); }
.verdict { margin-top: 22px; font-family: var(--serif); font-weight: 800; font-size: clamp(19px, 2.6vw, 27px); line-height: 1.15; }
.verdict .x { background: var(--ink); color: var(--bg); padding: 2px 14px; }
.verdict .p { background: var(--paper); color: var(--ink); padding: 2px 14px; }

/* ---------- 参数行（唯一的输入区） ---------- */
.controls { border-top: 4px solid var(--ink); border-bottom: 4px solid var(--ink); padding: 14px 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 26px; }
.cnum { display: inline-flex; align-items: baseline; gap: 8px; font: 700 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.cnum input { width: 5.6ch; border: 0; border-bottom: 4px solid var(--ink); background: none; text-align: center; padding: 0 0 1px;
  font-family: var(--serif); font-weight: 900; font-size: 24px; line-height: 1; }
.cnum input:focus { outline: none; border-bottom-color: var(--ink-3); }
.pillrow { display: inline-flex; }
.pillrow button { border: 0; background: none; cursor: pointer; padding: 8px 14px; font: 800 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.pillrow button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pillrow button:disabled { opacity: .35; cursor: not-allowed; }
.controls .split { width: 4px; align-self: stretch; background: var(--ink); }
@media (max-width: 700px) { .controls .split { display: none; } }

/* ---------- 栏目 ---------- */
.sec { margin-top: 42px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; border-bottom: 4px solid var(--ink); padding-bottom: 8px; margin-bottom: 0; }
.sec-head h2 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 4vw, 44px); line-height: 1; letter-spacing: -.015em; }
.sec-head .side { font: 700 11px/1.5 var(--sans); letter-spacing: .08em; text-transform: uppercase; text-align: right; }

/* ---------- KPI 行 ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { padding: 24px 22px 20px; display: grid; gap: 6px; align-content: start; }
.kpi.t-ink { background: var(--ink); color: var(--bg); }
.kpi.t-paper { background: var(--paper); color: var(--ink); }
.kpi .l { font: 800 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kpi .v { font-family: var(--serif); font-weight: 900; font-size: clamp(40px, 4.6vw, 58px); line-height: .95; letter-spacing: -.02em; white-space: nowrap; }
.kpi .v small { font-size: .42em; font-weight: 800; letter-spacing: 0; margin-left: 3px; }
.kpi .d { font: 500 12px/1.45 var(--sans); opacity: .85; }
.kpi .bad { background: var(--paper); color: var(--ink); font: 800 11px/1 var(--sans); letter-spacing: .1em; padding: 4px 10px; justify-self: start; }
.kpi.t-paper .bad { background: var(--ink); color: var(--paper); }
.planrow { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 4px solid var(--ink); }
.planrow button, .planrow span.tagp { border: 0; background: none; cursor: pointer; padding: 9px 16px; font: 800 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.planrow button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.planrow span.tagp { cursor: help; margin-left: auto; }

/* ---------- 反白图表面板 ---------- */
.panel { background: var(--ink); color: var(--bg); padding: 26px 30px 24px; }
.panel .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.panel .p-head b { font-family: var(--serif); font-weight: 800; font-size: 22px; letter-spacing: -.005em; }
.panel .p-head span { font: 700 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 700 11px var(--sans); letter-spacing: .06em; fill: var(--bg); }
.chart text.fig { font: 900 12px var(--serif); letter-spacing: 0; }
.chart .grid line { stroke: var(--grid); stroke-width: 2; }

/* VRAM 条 */
.vrow { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; margin-bottom: 12px; }
.vrow .rl { font-family: var(--serif); font-weight: 900; font-size: 18px; text-align: right; }
.vbar { display: flex; height: 34px; background: rgba(60,216,150,.12); }
.vbar i { display: block; height: 100%; border-right: 2px solid var(--ink); position: relative; overflow: hidden; }
.vbar i:last-child { border-right: 0; }
.vbar i em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 10.5px var(--sans); letter-spacing: .06em; font-style: normal; text-transform: uppercase; white-space: nowrap; }
.vnote { font: 700 11px/1.6 var(--sans); letter-spacing: .08em; text-transform: uppercase; opacity: .9; margin: 2px 0 0; }
.vnote b { font-family: var(--serif); font-weight: 900; font-size: 15px; letter-spacing: 0; }

/* Phase 对照（agenda 行） */
.phase { display: grid; grid-template-columns: 1fr 1fr; gap: 0 44px; }
@media (max-width: 700px) { .phase { grid-template-columns: 1fr; } }
.phase h3 { margin: 0; padding: 12px 0 10px; font-family: var(--serif); font-weight: 800; font-size: 26px; display: flex; justify-content: space-between; align-items: baseline; }
.phase h3 span { font: 800 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 5px 10px; }
.phase .rows { border-top: 4px solid var(--ink); }
.phase .r { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 2px solid var(--rule); font: 700 11.5px/1.3 var(--sans); letter-spacing: .07em; text-transform: uppercase; }
.phase .r .fig { font-family: var(--serif); font-weight: 900; font-size: 21px; letter-spacing: 0; text-transform: none; white-space: nowrap; }
.phase .r:last-child { border-bottom: 4px solid var(--ink); }
.phase .r button { border: 0; background: none; cursor: pointer; padding: 0 4px; font-weight: 800; color: var(--ink-3); }
.phase .r button:hover { color: var(--ink); }

/* 方案列表（agenda rows） */
.plans { border-top: 4px solid var(--ink); }
.plan-r { display: grid; grid-template-columns: 52px 1fr auto auto auto; gap: 8px 18px; align-items: baseline; padding: 12px 4px; border-bottom: 2px solid var(--rule); cursor: pointer; }
.plan-r:last-child { border-bottom: 4px solid var(--ink); }
.plan-r:hover { background: rgba(15,26,92,.06); }
.plan-r[aria-current="true"] { background: var(--ink); color: var(--bg); }
.plan-r .ord { font-family: var(--serif); font-weight: 900; font-size: 26px; line-height: 1; }
.plan-r .name { font-family: var(--serif); font-weight: 800; font-size: 19px; letter-spacing: -.005em; }
.plan-r .fig { font-family: var(--serif); font-weight: 900; font-size: 19px; white-space: nowrap; }
.plan-r .fig small { font: 700 10px var(--sans); letter-spacing: .08em; margin-left: 4px; }
.plan-r .miss { font: 800 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; background: var(--paper); color: var(--ink); padding: 4px 8px; align-self: center; }
.plan-r[aria-current="true"] .miss { background: var(--paper); }
@media (max-width: 700px) { .plan-r { grid-template-columns: 40px 1fr auto; } .plan-r .fig:nth-child(4), .plan-r .fig:nth-child(5) { display: none; } }
.morebtn { border: 0; background: none; cursor: pointer; padding: 10px 4px; font: 800 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.morebtn:hover { color: var(--ink-3); }

/* 部署 */
.deploy { display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; }
@media (max-width: 860px) { .deploy { grid-template-columns: 1fr; } }
.node { border: 4px solid var(--ink); padding: 10px; margin-bottom: 12px; }
.node .nh { display: flex; justify-content: space-between; font: 800 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
.gpus { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.gpu { padding: 6px 2px; text-align: center; font: 800 10px/1.4 var(--sans); letter-spacing: .04em; }
.gpu.g-ink { background: var(--ink); color: var(--bg); }
.gpu.g-paper { background: var(--paper); color: var(--ink); }
.gpu.g-line { background: none; box-shadow: inset 0 0 0 2px var(--ink); }
.cmdt { display: flex; justify-content: space-between; align-items: center; font: 800 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; margin: 12px 0 6px; }
.cmdt button { border: 0; background: var(--ink); color: var(--bg); cursor: pointer; padding: 6px 14px; font: 800 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.cmdt button:hover { background: var(--ink-3); }
.cmd { background: var(--ink); color: var(--bg); padding: 14px 16px; font: 500 12px/1.65 var(--mono); overflow-x: auto; white-space: pre; margin: 0; }
.cmdnote { font: 700 11px/1.7 var(--sans); letter-spacing: .06em; text-transform: uppercase; margin: 8px 0 0; opacity: .9; }

/* 抽屉 */
details.drawer { border-top: 4px solid var(--ink); margin-top: 42px; }
details.drawer > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 16px; padding: 14px 0; }
details.drawer > summary::-webkit-details-marker { display: none; }
details.drawer > summary h2 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1; }
details.drawer > summary .side { margin-left: auto; font: 800 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
details.drawer > summary::before { content: "+"; font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1; }
details.drawer[open] > summary::before { content: "−"; }
details.drawer > .body { padding: 4px 0 22px; }

/* 假设网格 */
.adv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px 26px; }
.adv-grid .field { display: grid; gap: 4px; font: 700 10.5px/1.4 var(--sans); letter-spacing: .07em; text-transform: uppercase; }
.adv-grid input { border: 0; border-bottom: 4px solid var(--ink); background: none; padding: 2px 0; font-family: var(--serif); font-weight: 900; font-size: 19px; }
.adv-grid input:focus { outline: none; border-bottom-color: var(--ink-3); }
.calrow { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; border-top: 2px solid var(--rule); margin-top: 18px; padding-top: 16px; }
.btn-ink { border: 0; background: var(--ink); color: var(--bg); cursor: pointer; padding: 10px 18px; font: 800 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.btn-ink:hover { background: var(--ink-3); }
.calmsg { font: 700 11px/1.5 var(--sans); letter-spacing: .06em; }

/* 轨迹 */
.trace-tools { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.trace-tools input { flex: 1; min-width: 150px; border: 0; border-bottom: 4px solid var(--ink); background: none; padding: 6px 2px; font: 500 14px var(--sans); }
.trace-tools input:focus { outline: none; }
.tgroup { border-top: 2px solid var(--rule); }
.tgroup > summary { cursor: pointer; list-style: none; }
.tgroup > summary::-webkit-details-marker { display: none; }
.tgroup > summary h4 { margin: 0; padding: 10px 0 8px; font-family: var(--serif); font-weight: 800; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.tgroup > summary h4 small { font: 700 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.step { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 14px; padding: 8px 6px; }
.step:hover, .step.flash { background: rgba(15,26,92,.06); }
.step.flash { outline: 3px solid var(--ink); }
.step .lbl { font: 700 13px/1.4 var(--sans); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step .kindtag { font: 800 9px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; background: var(--paper); }
.step .kindtag.k-assumption { background: var(--ink); color: var(--bg); }
.step .val { font-family: var(--serif); font-weight: 900; font-size: 17px; text-align: right; white-space: nowrap; }
.step .fx, .step .in { grid-column: 1/-1; font: 500 11.5px/1.5 var(--mono); overflow-wrap: anywhere; opacity: .85; }
.step .src { grid-column: 1/-1; font: 500 11px/1.5 var(--sans); opacity: .75; overflow-wrap: anywhere; }
.step .src button { border: 0; background: none; cursor: pointer; padding: 0; font: 700 11px var(--mono); text-decoration: underline; }
.step pre { grid-column: 1/-1; margin: 4px 0 0; max-height: 300px; overflow: auto; background: var(--ink); color: var(--bg); padding: 12px; font: 500 11px/1.6 var(--mono); }
.sources { display: grid; gap: 8px; font: 500 12.5px/1.7 var(--sans); }

/* 页脚 */
.footline { display: flex; justify-content: space-between; gap: 12px; border-top: 4px solid var(--ink); margin-top: 46px; padding-top: 14px; font: 700 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
.footline button { border: 0; background: none; cursor: pointer; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; text-decoration: underline; }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 12px; font: 500 12px/1.5 var(--sans); max-width: 300px; display: grid; gap: 2px; }
.tip b { font-family: var(--serif); font-weight: 800; font-size: 14px; }
.tip .kv { display: flex; justify-content: space-between; gap: 16px; }
.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; font: 800 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; z-index: 60; }
.empty { padding: 26px; text-align: center; font: 700 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
</style>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header class="masthead" data-reveal style="--d:0ms"><span>Infra_cal · vLLM Roofline</span><span id="mastRight">B200 / A100</span></header>
  <div class="rule4" data-reveal style="--d:0ms"></div>

  <!-- 封面：配置即宣言 -->
  <section class="cover" data-reveal style="--d:60ms">
    <p class="eyebrow">推理部署计算器</p>
    <button class="model-line" id="modelBtn" type="button" title="点击切换模型"></button>
    <div class="orn" aria-hidden="true"><span class="rules"><i></i><i></i></span><span class="word serif">on</span><span class="rules"><i></i><i></i></span></div>
    <button class="gpu-line" id="gpuBtn" type="button" title="点击切换 GPU"></button>
    <p class="verdict" id="verdict"></p>
  </section>

  <!-- 参数行 -->
  <div class="controls" data-reveal style="--d:130ms" id="controls">
    <span class="pillrow" id="precPick"></span>
    <span class="split"></span>
    <span class="cnum">输入 <input id="promptLen" type="number" min="1" step="128"></span>
    <span class="cnum">输出 <input id="outputLen" type="number" min="1" step="64"></span>
    <span class="cnum">并发 <input id="targetConcurrency" type="number" min="0" step="8"></span>
    <span class="cnum">TPOT≤ <input id="tpotSlaMs" type="number" min="0" step="5"> ms</span>
    <span class="cnum">节点≤ <input id="maxNodes" type="number" min="1" max="8"></span>
    <span class="split"></span>
    <span class="pillrow" id="objPick"></span>
  </div>
  <p class="chrome" id="precWarn" style="font-size:11px;text-align:center;margin:10px 0 0" hidden></p>

  <!-- 指标 -->
  <section class="sec" data-reveal style="--d:200ms">
    <div class="sec-head"><h2>指标</h2><span class="side" id="kpiSide"></span></div>
    <div class="planrow" id="planNav"></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <!-- 显存 -->
  <section class="sec" data-reveal style="--d:260ms">
    <div class="sec-head"><h2>显存</h2><span class="side" id="memSide"></span></div>
    <div class="panel" id="vramPanel" style="margin-top:0"></div>
  </section>

  <!-- 时间 -->
  <section class="sec" data-reveal style="--d:320ms">
    <div class="sec-head"><h2>时间</h2><span class="side" id="phaseSide"></span></div>
    <div class="phase" id="phase" style="margin-top:14px"></div>
  </section>

  <!-- 扫描 -->
  <section class="sec" data-reveal style="--d:380ms">
    <div class="sec-head"><h2>扫描</h2><span class="side">点击柱子 = 钉选 batch</span></div>
    <div class="panel" id="batchPanel"></div>
  </section>

  <!-- 方案 -->
  <section class="sec" data-reveal style="--d:420ms">
    <div class="sec-head"><h2>方案</h2><span class="side" id="planSide"></span></div>
    <div class="panel" id="paretoPanel" style="margin-bottom:26px"></div>
    <div class="plans" id="plans"></div>
  </section>

  <!-- 部署 -->
  <section class="sec" data-reveal style="--d:460ms">
    <div class="sec-head"><h2>部署</h2><span class="side" id="deploySide"></span></div>
    <div class="deploy" style="margin-top:16px">
      <div id="topo"></div>
      <div id="cmds"></div>
    </div>
  </section>

  <!-- 假设 -->
  <details class="drawer" data-reveal style="--d:500ms">
    <summary><h2>假设</h2><span class="side">可调 · 影响所有结果</span></summary>
    <div class="body">
      <div class="adv-grid" id="advGrid"></div>
      <div class="calrow">
        <span class="cnum">实测 batch <input id="calB" type="number" min="1" value="1" style="border-bottom:4px solid var(--ink);background:none;border-top:0;border-left:0;border-right:0;width:5ch;text-align:center;font-family:var(--serif);font-weight:900;font-size:19px"></span>
        <span class="cnum">实测 TPOT <input id="calT" type="number" min="0" step="0.5" placeholder="12.5" style="border-bottom:4px solid var(--ink);background:none;border-top:0;border-left:0;border-right:0;width:7ch;text-align:center;font-family:var(--serif);font-weight:900;font-size:19px"> ms</span>
        <button class="btn-ink" id="calBtn" type="button">反推带宽系数 η</button>
        <span class="calmsg" id="calMsg"></span>
      </div>
    </div>
  </details>

  <!-- 轨迹 -->
  <details class="drawer" id="traceCard" data-reveal style="--d:520ms">
    <summary><h2>轨迹</h2><span class="side"><button class="btn-ink" id="exportTrace" type="button" style="padding:8px 14px">复制 JSON</button></span></summary>
    <div class="body">
      <div class="trace-tools"><input id="traceFilter" type="search" placeholder="筛选：KV / TPOT / AllReduce…"></div>
      <div id="trace"></div>
    </div>
  </details>

  <!-- 来源 -->
  <details class="drawer" data-reveal style="--d:540ms">
    <summary><h2>来源</h2><span class="side">官方数字出处 · 模型边界</span></summary>
    <div class="body"><div class="sources" id="sources"></div></div>
  </details>

  <footer class="footline" data-reveal style="--d:560ms">
    <span>Roofline 估算 · 非基准测试</span>
    <span><button id="shareBtn" type="button">复制分享链接</button> · <button id="resetBtn" type="button">恢复默认</button></span>
  </footer>
</div>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
